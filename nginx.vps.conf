# ==============================================================================
# NGINX CONFIGURATION FOR DIGITALOCEAN VPS (Bibi Store POS)
# IP: 143.198.163.70
# Ubicación en VPS: /etc/nginx/sites-available/bibi-store
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 143.198.163.70 localhost _;

    # Directorio de la aplicación frontend compilada
    root /var/www/bibi-store/dist;
    index index.html;

    # 1. GESTIÓN DE PAYLOAD Y TIMEOUTS (Solución al error 413 Payload Too Large)
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    proxy_connect_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # 2. COMPRESIÓN GZIP DE ALTO RENDIMIENTO
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 3. CABECERAS DE SEGURIDAD
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 4. SERVIDO DIRECTO DE IMÁGENES DESACOPLADAS (Zero Node.js Overhead)
    location /uploads/ {
        alias /var/www/bibi-store/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 5. CACHE DE ASSETS ESTÁTICOS COMPILADOS (Vite / Remix)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 6. SIN CACHÉ PARA SERVICE WORKERS Y MANIFEST
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 7. PROXY REVERSO A LA API DE NODE.JS (Puerto 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 8. ENRUTAMIENTO CLIENT-SIDE SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
